[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "furryfilefinagler"
dynamic = ["version"]  # from fff/__init__.py (see CHANGELOG.md)
description = "Toolkit for e621 archiving, reverse-image source search, and media library management"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "urllib3>=2.0",
    "mysql-connector-python>=9.0",
    "beautifulsoup4>=4.12",
    "Send2Trash>=1.8",
    "Flask>=3.0",
    "Pillow>=10.0",
    "ImageHash>=4.3",
    "numpy>=1.26",
    "scipy>=1.11",
    "PyWavelets>=1.5",
    "opencv-python>=4.8",
    "xxhash>=3.0",
    "colorama>=0.4",
]

[project.optional-dependencies]
audio = ["pygame-ce>=2.4"]
dev = ["pytest>=8.0", "ruff==0.17.3"]

[project.scripts]
fff = "fff.cli.app:main"

[tool.setuptools.dynamic]
version = { attr = "fff.__version__" }

[tool.setuptools.packages.find]
include = ["fff*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# Starting rule set (docs/IMPROVEMENT_PLAN.md part 8); add rules gradually.
select = ["E9", "F", "W605", "E722"]
# F841 (unused variable): 24 left that each need a look, not a bulk fix (plan part 8).
ignore = ["F841"]
